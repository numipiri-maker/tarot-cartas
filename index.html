<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Leitura Personalizada</title>

<style>
body {
  font-family: Georgia, serif;
  background: transparent;
  color: #fff;
  text-align: center;
  padding: 40px 20px;
}

button {
  background: linear-gradient(135deg,#7b2cbf,#9d4edd);
  border: none;
  color: #fff;
  padding: 16px 34px;
  border-radius: 14px;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,.35);
}
</style>
</head>

<body>

<h2>Leitura Personalizada</h2>

<p style="line-height:1.7;max-width:600px;margin:20px auto;opacity:.9">
Para continuares, vais preencher um pequeno formulário
com o teu email e a tua pergunta.
</p>

<button onclick="irParaFormulario()">
Avançar para o formulário
</button>

<script>
function irParaFormulario() {
  const isMobile =
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile) {
    window.location.href = "form-mobile.html";
  } else {
    window.location.href =
      "https://docs.google.com/forms/d/1WmGgX8eLYhPUPt7DQTCvsMbAohUtzmfrYJSHSIu42Mk/viewform";
  }
}
</script>

</body>
</html>
